<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Your Profile</title>
    <link rel="stylesheet" href="css/profile.css">
    <ling rel="preconnect" href="https//cdn.jsdelivr.net"
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@wikiline/webfont-golos-ui@latest/css/all.css">
    <title>SM | Profile</title>
</head>
<body>
    <div class="profile">

        <div class="profile__buttons">
            <img class="profile__button-icon" src="/img/news-page/home.png" alt="news">
            <img class="profile__button-icon" src="/img/profile-page/person.png" alt="profile">
            <img class="profile__button-icon" src="img/news-page/plus.png" alt="Add new news">
        </div>

        <img src="/img/news-page/avatars/Ivan-Denisov.jpg" class="profile__avatar" alt="avatar">

        <p class="profile__username">Ваня Денисов</p>

        <p class="profile__description">
            Привет! Я системный аналитик в АСМЕ!
            Тут моя жизнь только для самых классных!
        </p>

        <p class="profile__count">
            <img src="/img/profile-page/image.png" alt="picture" class="profile__count-picture">
            43 поста
        </p>

        <div class="profile__media">
            <img class="profile__media-image" src="/img/profile-page/media/Ivan-Denisov.jpg" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/building.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/eating.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/corporative.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/coffe.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/book.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/natrure.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/church.png" alt="picture">
            <img class="profile__media-image" src="/img/profile-page/media/flowers.png" alt="picture">
        </div>

    </div>
</body>
</html>
