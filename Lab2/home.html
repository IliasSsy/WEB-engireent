<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Scroll-page</title>
<link href="css/news.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@wikiline/webfont-golos-ui@latest/css/all.css">
<title>SM | Home</title>
</head>

<body>

<div class="page">

<div class="page__buttons">
<img src="/img/news-page/home.png" alt="news">
<img src="/img/news-page/person.png" alt="profile">
<img src="img/news-page/plus.png" alt="Add new news">
</div>

<div class="post">

<div class="post__user">
<img src="/img/news-page/avatars/Ivan-Denisov.jpg" class="post__avatar" alt="avatar">
<p class="post__username">Ваня Денисов</p>
<img src="/img/news-page/redact.png" class="post__redact" alt="Redaction">
</div>

<p class="post__count">1/3</p>

<img src="/img/news-page/content/Ivan-Denisov.jpg" class="post__content" alt="Photo">

<p class="post__switch"><</p>
<p class="post__switch">></p>

<div class="post__containter-reactions">
<img src="/img/news-page/reaction/heart.png" class="post__reaction" alt="heart">
<p class="post__reaction">203</p>
</div>

<p class="post__comment">Так красиво сегодня на улице! Настоящая зима)) Вспоминается Бродский...</p>

<p class="post__add">ещё</p>
<p class="post__timelaps">2 часа назад</p>

</div>

<div class="post">
<div class="post__user">
<img src="/img/news-page/avatars/Liza-Demina.png" class="post__avatar" alt="avatar">
<p class="post__username">Лиза Дёмина</p>
</div>

<img src="/img/news-page/content/Elizaveta.jpg" class="post__photo" alt="Photo">
</div>

</div>

</body>
</html>
