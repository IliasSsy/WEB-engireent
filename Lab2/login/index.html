<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login_page.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@wikiline/webfont-golos-ui@latest/css/all.css">
    <title>SM | Sing-in</title>
</head>
<body>

    <div class="login">

        <div class="login__container">
            <h1 class="login__title">Вход</h1>
            <img src="img/login_page.png" class="login__hello-image" alt="Hello image"> 
        </div>    

        <div class="login__field">
            <p class="field__label-email">Электропочта</p>
            <input type="email" name="user_email" class="field__input">

            <p class="field__notice">
                Введите электропочту в формате *****@***.**
            </p>

            <p class="field__label-password">Пароль</p>
            <input type="password" name="user_password" class="field__input">

            <img class="field__eye" src="/img/login-page/eye.png" alt="Show password">

            <a href="home.html" class="field__continue-button">
                Продолжить
            </a>
        </div>

    </div>

</body>
</html>
